name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, openssl, zlib
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python -m pip install --require-hashes -r tools/source-mac-validation-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: ./.github/actions/setup-qpdf
      - name: Validate the independent PDF fixtures
        run: python tools/validate_reader_fixtures.py
      - name: Validate independent nested page-tree fixtures
        run: python tools/validate_page_tree_fixture.py
      - name: Compare LZW and packed predictors with qpdf
        run: python tools/validate_filter_cases.py
      - name: Validate CCITT fax samples and independent PDF rendering
        run: |
          python tools/build_fax_fixtures.py --check
          mkdir -p _build/fax
          python tools/validate_fax.py --report _build/fax/report.json
      - name: Compare standard Identity crypt streams with qpdf
        run: python tools/validate_identity_filters.py
      - name: Compare explicit external stream data with independent codecs
        run: python tools/validate_external_streams.py
      - name: Compare native graph import with pypdf, qpdf and certificate sources
        run: python tools/validate_import.py
      - name: Authenticate independently encrypted Standard-handler PDFs
        run: python tools/validate_authentication.py
      - name: Authenticate independently encrypted Adobe.PubSec PDFs
        run: python tools/validate_public_key_authentication.py
      - name: Verify Adobe.PubSec metadata ownership through physical aliases
        run: python tools/validate_public_key_aliases.py
      - name: Verify metadata ownership and indirect embedded-file crypt filters
        run: python tools/validate_metadata_security.py
      - name: Verify native source PDF MAC against independent CMS and ciphertext
        run: python tools/validate_source_mac.py
      - name: Compare hybrid initial, incremental and linearized documents
        run: python tools/validate_hybrid.py
      - name: Compare exact physical revisions and external signed histories
        run: |
          python tools/build_linearized_fixtures.py --check
          python tools/validate_revision_history.py
      - run: php examples/inspect.php tests/Fixtures/pdf/object-streams.pdf
      - run: php examples/parse-value.php
      - run: php examples/pages.php tests/Fixtures/page-tree/classic.pdf
      - run: php examples/pages.php tests/Fixtures/page-tree/object-streams.pdf
      - run: php examples/import.php tests/Fixtures/pdf/classic.pdf _build/import-example.pdf 1.7
