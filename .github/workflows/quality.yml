name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, openssl, zlib
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python -m pip install --require-hashes -r tools/validation-requirements.txt
      - uses: PDFToolkit/pdf/.github/actions/setup-qpdf@f27dc57dfb69553d180153ae81209b2f1e8cb418 # v0.7.1; checksum-verified qpdf 12.4.2
      - name: Validate the independent PDF fixtures
        run: python tools/validate_reader_fixtures.py
      - name: Validate independent nested page-tree fixtures
        run: python tools/validate_page_tree_fixture.py
      - name: Compare LZW and packed predictors with qpdf
        run: python tools/validate_filter_cases.py
      - name: Authenticate independently encrypted Standard-handler PDFs
        run: python tools/validate_authentication.py
      - name: Verify metadata ownership and indirect embedded-file crypt filters
        run: python tools/validate_metadata_security.py
      - name: Compare hybrid initial, incremental and linearized documents
        run: python tools/validate_hybrid.py
      - run: php examples/inspect.php tests/Fixtures/pdf/object-streams.pdf
      - run: php examples/parse-value.php
      - run: php examples/pages.php tests/Fixtures/page-tree/classic.pdf
      - run: php examples/pages.php tests/Fixtures/page-tree/object-streams.pdf
